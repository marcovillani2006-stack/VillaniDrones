<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyFrame</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0F172A;
      color: white;
    }

    body {
      overflow-x: hidden;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      height: 82px;
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
    }

    .topbar-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
    }

    .brand-menu {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .logo {
      position: relative;
      display: inline-block;
      padding-bottom: 11px;
      font-size: 1.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .logo::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: linear-gradient(to right, #009246 0 33.33%, #ffffff 33.33% 66.66%, #ce2b37 66.66% 100%);
    }

    .brand-dropdown {
      position: absolute;
      top: calc(50% + 20px);
      left: 0;
      display: grid;
      width: 100%;
      padding: 10px 0;
      border: 0;
      border-radius: 0 0 14px 14px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .brand-dropdown a {
      padding: 11px 16px;
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-dropdown a:hover,
    .brand-dropdown a:focus-visible {
      background: rgba(130,197,212,0.2);
    }

    .brand-menu:hover .brand-dropdown,
    .brand-menu:focus-within .brand-dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .brand-menu.is-open .brand-dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .menu {
      display: flex;
      gap: 24px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }

    .menu a {
      color: inherit;
      text-decoration: none;
    }

    .video-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
      padding-top: 82px;
    }

    .video-hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) saturate(1.1);
    }

    .youtube-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      object-fit: cover;
      filter: brightness(0.45) saturate(1.1);
      background: #000;
    }

    .fullscreen-video-frame iframe,
    .vertical-video-card iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .divider {
      width: 100%;
      height: 10px;
      background: #000000;
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .desktop-video-divider {
      position: relative;
      z-index: 10;
      display: block;
      height: 24px;
      background: #000;
      border: 0;
    }

    .split-section {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 340px;
      padding: 100px 7%;
      background: #0F172A;
      margin-top: -22px;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      transition: transform 0.15s linear;
      overflow: hidden;
    }

    .split-section::before {
      content: "";
      position: absolute;
      top: -28px;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0));
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .fullscreen-video {
      position: relative;
      width: 100%;
      height: max(100vh, calc(150vh - 21.428vw));
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    .fullscreen-video-frame {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: calc(42.857vw + 24px);
    }

    .fullscreen-video-frame::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      height: 24px;
      background: #000;
      pointer-events: none;
    }

    .fullscreen-video-frame video {
      display: block;
      width: 100%;
      height: calc(100% - 24px);
      object-fit: cover;
    }

    .vertical-videos-section {
      width: 100%;
      margin-top: -360px;
      padding: 80px 2%;
      background: #0F172A;
      position: relative;
      scroll-margin-top: 110px;
    }

    .vertical-videos-section::after {
      content: "";
      position: absolute;
      top: 300px;
      right: 0;
      left: 0;
      z-index: 0;
      height: 260px;
      background: rgba(71, 190, 220, 0.28);
      clip-path: polygon(46% 0, 54% 0, 72% 100%, 28% 100%);
      filter: blur(16px);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 45%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 45%, transparent 100%);
      pointer-events: none;
    }

    .drone-image {
      position: relative;
      top: -260px;
      left: 50%;
      z-index: 0;
      display: block;
      width: min(1750px, calc(100% + 500px));
      height: auto;
      margin: 0 0 -500px;
      transform: translateX(-50%);
    }

    .vertical-videos-grid {
      position: relative;
      z-index: 1;
      width: min(1100px, 100%);
      height: 700px;
      margin: 0 auto;
      perspective: 1200px;
      transform-style: preserve-3d;
      touch-action: pan-y;
    }

    .vertical-video-card {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(360px, 33%);
      height: 640px;
      transform-origin: 50% 100%;
      transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.75s ease, filter 0.75s ease;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .vertical-video-card[data-position="left"],
    .vertical-video-card[data-position="right"] {
      cursor: pointer;
    }

    .vertical-video-card[data-position="left"]::after,
    .vertical-video-card[data-position="right"]::after {
      content: "";
      position: absolute;
      inset: -48px;
      z-index: 0;
    }

    .vertical-video-card[data-position="center"] {
      z-index: 3;
      transform: translateX(-50%) translateZ(220px) rotateY(0deg);
    }

    .vertical-video-card[data-position="left"] {
      z-index: 1;
      opacity: 0.72;
      filter: brightness(0.65);
      transform: translateX(-155%) translateZ(-80px) rotateY(62deg);
    }

    .vertical-video-card[data-position="right"] {
      z-index: 2;
      opacity: 0.72;
      filter: brightness(0.65);
      transform: translateX(55%) translateZ(-80px) rotateY(-62deg);
    }

    .vertical-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      cursor: pointer;
    }

    .video-play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 50%;
      background: rgba(0,0,0,0.52);
      color: #fff;
      font: inherit;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(420px);
      transition: opacity 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .vertical-video-card[data-position="left"] .video-play-overlay,
    .vertical-video-card[data-position="right"] .video-play-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .video-play-overlay:hover {
      background: rgba(0,0,0,0.78);
      transform: translate(-50%, -50%) translateZ(420px) scale(1.06);
    }

    .video-play-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .video-carousel-controls {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 12px auto 0;
    }

    .video-carousel-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 48px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 2.4rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .video-carousel-button:hover {
      background: transparent;
      color: #82c5d4;
      transform: translateY(-2px);
    }

    .video-media-controls {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px auto 0;
      scroll-margin-top: 110px;
    }

    .video-media-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 48px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .video-media-button:hover {
      background: transparent;
      color: #82c5d4;
      transform: translateY(-2px);
    }

    @media (max-width: 700px) {
      .vertical-videos-section {
        margin-top: -180px;
        padding: 48px 7%;
        overflow-x: hidden;
        isolation: isolate;
      }

      .vertical-videos-section::after {
        content: "";
        position: absolute;
        top: 58px;
        right: 0;
        height: clamp(130px, 32vw, 170px);
        left: 0;
        z-index: 0;
        background: rgba(71, 190, 220, 0.28);
        clip-path: polygon(46% 0, 54% 0, 96% 100%, 4% 100%);
        filter: blur(12px);
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
        pointer-events: none;
      }

      .vertical-videos-grid {
        width: 100%;
        height: 510px;
      }

      .video-media-controls {
        margin: 8px auto 0;
        scroll-margin-top: 40px;
      }

      .video-carousel-controls {
        margin: -12px auto 0;
      }

      .drone-image {
        top: -80px;
        left: auto;
        right: auto;
        max-width: 100%;
        width: 100%;
        margin: 0 auto -90px;
        transform: none;
      }

      .vertical-video {
        width: min(260px, 72vw);
        height: 462px;
      }

      .vertical-video-card {
        width: min(260px, 72vw);
        height: 462px;
      }

      .vertical-video-card[data-position="center"] {
        transform: translateX(-50%) translateZ(120px) rotateY(0deg);
      }

      .vertical-video-card[data-position="left"] {
        transform: translateX(-125%) translateZ(-50px) rotateY(52deg);
      }

      .vertical-video-card[data-position="right"] {
        transform: translateX(25%) translateZ(-50px) rotateY(-52deg);
      }
    }

    @media (max-width: 700px) and (orientation: landscape) {
      .vertical-videos-section::after {
        top: 160px;
        height: clamp(100px, 28vw, 150px);
        clip-path: polygon(44% 0, 56% 0, 84% 100%, 16% 100%);
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%);
      }
    }

    .split-inner {
      width: min(1400px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1.65fr;
      gap: 40px;
      align-items: center;
    }

    .left-panel {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content-box {
      max-width: 720px;
      width: 100%;
      padding: 30px 10px;
    }

    .section-kicker {
      display: inline-block;
      margin-bottom: 16px;
      color: #ffffff;
      font-size: 1.2rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: clamp(2.6rem, 4vw, 4.6rem);
      line-height: 0.93;
      letter-spacing: -0.07em;
      color: white;
      max-width: 760px;
    }

    .section-text {
      margin: 0;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      line-height: 1.7;
      color: rgba(255,255,255,0.8);
      max-width: 500px;
    }

    .gallery-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: min(100%, 820px);
      margin-left: auto;
    }

    .gallery-arrow {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      user-select: none;
      flex-shrink: 0;
      padding: 0;
    }

    .gallery-arrow span {
      display: inline-block;
      transform: translateY(-1px);
    }

    .gallery-arrow:hover {
      transform: scale(1.05);
      background: rgba(130, 197, 212, 0.18);
      border-color: rgba(130, 197, 212, 0.5);
    }

    .right-panel {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .right-panel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      filter: saturate(1.1) contrast(1.05);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .drone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 220px;
      height: 120px;
      transform: translate(-50%, -50%) rotate(-12deg);
    }

    .drone-body {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 150px;
      height: 42px;
      background: #05070a;
      border-radius: 16px;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }

    .drone-body::before,
    .drone-body::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #111827;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.04);
    }

    .drone-body::before { left: 18px; }
    .drone-body::after { right: 18px; }

    .arm {
      position: absolute;
      background: #090d12;
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    }

    .arm.horizontal {
      left: 50%;
      top: 50%;
      width: 180px;
      height: 8px;
      transform: translate(-50%, -50%);
    }

    .arm.vertical {
      left: 50%;
      top: 50%;
      width: 8px;
      height: 110px;
      transform: translate(-50%, -50%);
    }

    .prop {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1a1f27 0%, #05070a 60%, #020406 100%);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 8px rgba(255,255,255,0.02);
    }

    .prop::before,
    .prop::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 58px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
    }

    .prop::after {
      width: 58px;
      height: 2px;
    }

    .prop.p1 { left: 12px; top: 12px; }
    .prop.p2 { right: 12px; top: 12px; }
    .prop.p3 { left: 12px; bottom: 12px; }
    .prop.p4 { right: 12px; bottom: 12px; }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(3, 8, 12, 0.8), rgba(3, 8, 12, 0.25), rgba(3, 8, 12, 0.5));
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 40px 7%;
    }

    .text-box {
      max-width: 700px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #d9f6ff;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 7vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p {
      margin: 20px 0 30px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      max-width: 620px;
      color: rgba(255,255,255,0.82);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.primary {
      background: linear-gradient(135deg, #82c5d4, #0F172A);
      color: #000000;
      border-color: #0F172A;
    }

    .btn.secondary {
      background: rgba(255,255,255,0.04);
      color: white;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 64px;
      }

      .topbar-inner {
        padding: 0 5%;
      }

      .logo {
        padding-bottom: 7px;
        font-size: 1.05rem;
      }

      .logo::after {
        height: 5px;
      }

      .brand-dropdown {
        top: calc(50% + 12px);
        background: #000;
      }

      .video-hero {
        padding-top: 64px;
      }

      .desktop-video-divider {
        display: none;
      }

      .fullscreen-video {
        height: 56.25vw;
        min-height: 200px;
        max-height: 60vh;
      }

      .fullscreen-video-frame {
        height: 100%;
        aspect-ratio: auto;
      }

      .fullscreen-video-frame::after {
        display: none;
      }

      .fullscreen-video-frame video {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        object-fit: cover;
      }

      .content {
        align-items: flex-start;
        padding: 30px 5% 52px;
      }

      .text-box {
        max-width: 100%;
      }

      h1 {
        font-size: clamp(2.5rem, 12vw, 4rem);
      }

      p {
        font-size: 1.05rem;
        margin: 16px 0 24px;
      }

      .btn {
        min-height: 48px;
        padding: 0 22px;
      }

      .split-section {
        min-height: 0;
        padding: 48px 7%;
      }

      .split-inner {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .content-box {
        padding: 12px 0;
      }

      .section-kicker {
        font-size: 0.9rem;
      }

      .section-title {
        font-size: clamp(2rem, 9vw, 3rem);
      }

      .gallery-wrap {
        width: 100%;
        gap: 10px;
        min-width: 0;
      }

      .gallery-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.8rem;
        position: relative;
        z-index: 3;
        border-color: rgba(255,255,255,0.7);
        background: rgba(0,0,0,0.85);
      }

      .right-panel {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        border-radius: 14px;
      }

      .right-panel img {
        border-radius: 14px;
      }
    }

    @media (max-width: 700px) and (orientation: landscape) {
      .video-hero {
        min-height: 100vh;
      }

      .content {
        min-height: calc(100vh - 64px);
        padding: 18px 5% 28px;
      }

      .text-box {
        max-width: 72%;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 2.8rem);
      }

      p {
        max-width: 560px;
        margin: 10px 0 14px;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .btn {
        min-height: 42px;
        padding: 0 18px;
      }
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .video-hero {
        height: 88vh;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-menu">
        <a class="logo" href="index.html" aria-haspopup="true" aria-expanded="false">VILLANI</a>
        <nav class="brand-dropdown" aria-label="Navigazione rapida">
          <a href="index.html">Home</a>
          <a href="contatti.html">Contatti</a>
          <a href="#reel">reels</a>
        </nav>
      </div>
    
    </div>
  </header>

  <div class="video-hero">
    <video autoplay muted loop playsinline data-youtube-url="https://youtu.be/A7n6ABKEBUo">
      <source src="video/LandingPage.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
      <div class="text-box">
        <h1>Il tuo mondo da un punto di vista unico</h1>
        <p>
          Video e foto drone per eventi, immobili e aziende. Realizziamo immagini cinematiche che raccontano il tuo brand con impatto.
        </p>
        <div class="buttons">
          <a href="contatti.html" class="btn primary">Contattaci</a>
        </div>
      </div>
      
    </div>
    
  </div>

  <div class="divider" aria-hidden="true"></div>

  <section class="split-section">
    <div class="split-inner">
      <div class="left-panel">
        <div class="content-box">
          <span class="section-kicker">COSA FACCIAMO</span>
          <h2 class="section-title">realizziamo riprese aeree uniche per attività commerciali e privati</h2>
          
        </div>
      </div>

      <div class="gallery-wrap">
        <button class="gallery-arrow" type="button" aria-label="Foto precedente"><span>&#8249;</span></button>

        <div class="right-panel" aria-hidden="true">
          <img id="gallery-image" src="" alt="Foto drone">
        </div>

        <button class="gallery-arrow" type="button" aria-label="Foto successiva"><span>&#8250;</span></button>
      </div>
    </div>
  </section>

  <section class="fullscreen-video" aria-label="Video a schermo intero">
    <div class="fullscreen-video-frame">
      <video id="illustration-video" autoplay muted loop playsinline data-youtube-url="https://youtu.be/6oxGLqYrR5g">
        <source src="video/Illustrazione.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="vertical-videos-section" aria-label="Video verticali">
    <img class="drone-image" src="video/droneAir3s.png" alt="Drone Air 3S">

    <div class="vertical-videos-grid">
      <div class="vertical-video-card" data-position="center">
        <video class="vertical-video" muted loop playsinline preload="metadata" data-youtube-url="https://youtube.com/shorts/n8DQ6Y5kivY">
          <source src="video/FPV.mp4" type="video/mp4">
        </video>
        <button class="video-play-overlay" type="button" aria-label="Riproduci video">&#9654;</button>
      </div>

      <div class="vertical-video-card" data-position="right">
        <video class="vertical-video" muted loop playsinline preload="metadata" data-youtube-url="https://youtube.com/shorts/6NAODjxHmbY">
          <source src="video/catria2.mp4" type="video/mp4">
        </video>
        <button class="video-play-overlay" type="button" aria-label="Riproduci video">&#9654;</button>
      </div>

      <div class="vertical-video-card" data-position="left">
        <video class="vertical-video" muted loop playsinline preload="metadata" data-youtube-url="https://youtube.com/shorts/-e-qycxdBqs">
          <source src="video/FPV.mp4" type="video/mp4">
        </video>
        <button class="video-play-overlay" type="button" aria-label="Riproduci video">&#9654;</button>
      </div>
    </div>

    <div class="video-carousel-controls" aria-label="Controlli video">
      <button class="video-carousel-button" type="button" data-direction="left" aria-label="Ruota i video a sinistra">&#8249;</button>
      <button class="video-carousel-button" type="button" data-direction="right" aria-label="Ruota i video a destra">&#8250;</button>
    </div>

    <div class="video-media-controls" aria-label="Riproduzione e audio">
      <button class="video-media-button" id="video-audio-toggle" type="button" aria-label="Attiva audio">&#128263;</button>
    </div>
  </section>

  <script>
    const splitSection = document.querySelector('.split-section');
    const fullscreenVideo = document.querySelector('.fullscreen-video');
    const illustrationVideo = document.getElementById('illustration-video');
    const illustrationSource = illustrationVideo ? illustrationVideo.querySelector('source') : null;
    const galleryImage = document.getElementById('gallery-image');
    const galleryArrows = document.querySelectorAll('.gallery-arrow');

    function toYouTubeEmbedUrl(rawUrl) {
      if (!rawUrl) {
        return '';
      }

      const trimmed = rawUrl.trim();
      const match = trimmed.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      const videoId = match ? match[1] : trimmed.match(/([A-Za-z0-9_-]{11})/)?.[1] || '';

      if (!videoId) {
        return trimmed;
      }

      const params = new URLSearchParams({
        autoplay: '1',
        mute: '1',
        loop: '1',
        playlist: videoId,
        controls: '0',
        rel: '0',
        playsinline: '1',
        enablejsapi: '1'
      });

      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        params.set('origin', window.location.origin);
      }

      return `https://www.youtube.com/embed/${videoId}?${params.toString()}`;
    }

    function replaceVideoWithYoutube(videoElement) {
      const rawUrl = videoElement.dataset.youtubeUrl || '';
      const embedUrl = toYouTubeEmbedUrl(rawUrl);

      if (!embedUrl || !rawUrl.includes('youtube') && !rawUrl.includes('youtu.be')) {
        return;
      }

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.title = 'Video YouTube';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      iframe.loading = 'lazy';
      iframe.className = 'youtube-video';

      const wrapper = videoElement.parentElement;
      wrapper.replaceChild(iframe, videoElement);
    }

    const verticalVideos = document.querySelectorAll('.vertical-video');
    const verticalVideoCards = document.querySelectorAll('.vertical-video-card');
    const verticalVideosGrid = document.querySelector('.vertical-videos-grid');
    const videoCarouselButtons = document.querySelectorAll('.video-carousel-button');
    const videoPlayToggles = document.querySelectorAll('.video-play-overlay');
    const videoAudioToggle = document.getElementById('video-audio-toggle');
    const galleryImages = [
      'ImmaginiScroll/DJI_0850.JPG',
      'ImmaginiScroll/DJI_0035.JPG',
      'ImmaginiScroll/LagoTrasimeno.png'
    ];
    let currentImageIndex = 0;

    function loadBestIllustrationVideo() {
      if (illustrationVideo && illustrationVideo.dataset.youtubeUrl && illustrationVideo.dataset.youtubeUrl.trim()) {
        return;
      }

      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const isMobile = window.matchMedia('(max-width: 700px)').matches;
      const canLoad4K = !isMobile && connection && !connection.saveData && (
        connection.downlink >= 15 || connection.effectiveType === '4g'
      );

      if (canLoad4K && illustrationSource) {
        illustrationSource.src = 'video/illustrazione4k.mp4';
        illustrationVideo.load();
      }
    }

    function updateParallax() {
      const scrollY = window.scrollY || window.pageYOffset;
      const offset = Math.min(scrollY * 0.9, 170);
      splitSection.style.transform = `translate3d(0, ${-offset}px, 0)`;
      fullscreenVideo.style.transform = `translate3d(0, ${-offset}px, 0)`;
    }

    function updateGallery(nextIndex) {
      const safeIndex = (nextIndex + galleryImages.length) % galleryImages.length;
      currentImageIndex = safeIndex;
      const selected = galleryImages[safeIndex];

      if (selected.endsWith('.mp4')) {
        galleryImage.src = selected;
        galleryImage.style.objectFit = 'cover';
        return;
      }

      galleryImage.src = selected;
      galleryImage.style.objectFit = 'cover';
    }

    function centerReelVideo() {
      const centerVideo = document.querySelector('.vertical-video-card[data-position="center"] .vertical-video');
      if (centerVideo) {
        centerVideo.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });
      }
    }

    galleryArrows.forEach((button, index) => {
      button.addEventListener('click', () => {
        const delta = index === 0 ? -1 : 1;
        updateGallery(currentImageIndex + delta);
      });
    });

    verticalVideos.forEach((video) => {
      const videoCard = video.closest('.vertical-video-card');
      const videoPlayToggle = videoCard.querySelector('.video-play-overlay');

      video.addEventListener('play', () => {
        verticalVideos.forEach((otherVideo) => {
          if (otherVideo !== video) {
            otherVideo.pause();
          }
        });
        videoPlayToggle.innerHTML = '&#10074;&#10074;';
        videoPlayToggle.classList.add('is-hidden');
        videoPlayToggle.setAttribute('aria-label', 'Metti in pausa i video');
      });

      video.addEventListener('pause', () => {
        const anotherVideoIsPlaying = Array.from(verticalVideos).some((otherVideo) => !otherVideo.paused);
        if (!anotherVideoIsPlaying) {
          videoPlayToggle.innerHTML = '&#9654;';
          videoPlayToggle.classList.remove('is-hidden');
          videoPlayToggle.setAttribute('aria-label', 'Riproduci video');
        }
      });

      video.addEventListener('click', () => {
        if (videoCard.dataset.position === 'center' && !video.paused) {
          video.pause();
        }
      });

      videoCard.addEventListener('click', (event) => {
        if (event.target.closest('.video-play-overlay')) {
          return;
        }

        if (!window.matchMedia('(max-width: 700px)').matches && videoCard.dataset.position !== 'center') {
          rotateVideos(videoCard.dataset.position === 'right' ? 'left' : 'right');
        }
      });
    });

    videoPlayToggles.forEach((videoPlayToggle) => {
      videoPlayToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        const video = videoPlayToggle.closest('.vertical-video-card').querySelector('.vertical-video');

        if (video.paused) {
          video.play().catch(() => {
            videoPlayToggle.classList.remove('is-hidden');
            videoPlayToggle.setAttribute('aria-label', 'Riproduzione non disponibile');
          });
        } else {
          video.pause();
        }
      });
    });

    videoAudioToggle.addEventListener('click', () => {
      if (!verticalVideos.length) {
        return;
      }

      const shouldMuteVideos = !verticalVideos[0].muted;
      verticalVideos.forEach((video) => {
        video.muted = shouldMuteVideos;
      });
      videoAudioToggle.innerHTML = shouldMuteVideos ? '&#128263;' : '&#128266;';
      videoAudioToggle.setAttribute('aria-label', shouldMuteVideos ? 'Attiva audio' : 'Disattiva audio');
    });

    function rotateVideos(direction) {
      const positionsByDirection = direction === 'left'
        ? { center: 'left', left: 'right', right: 'center' }
        : { center: 'right', right: 'left', left: 'center' };

      verticalVideoCards.forEach((videoCard) => {
        const nextPosition = positionsByDirection[videoCard.dataset.position];
        const video = videoCard.querySelector('.vertical-video');
        videoCard.dataset.position = nextPosition;
        video.dataset.position = nextPosition;

        if (nextPosition !== 'center') {
          video.pause();
        }
      });
    }

    videoCarouselButtons.forEach((button) => {
      button.addEventListener('click', () => {
        rotateVideos(button.dataset.direction);
      });
    });

    let touchStartX = 0;
    let touchStartY = 0;

    verticalVideosGrid.addEventListener('touchstart', (event) => {
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    verticalVideosGrid.addEventListener('touchend', (event) => {
      if (!window.matchMedia('(max-width: 700px)').matches) {
        return;
      }

      const touchEnd = event.changedTouches[0];
      const horizontalDistance = touchEnd.clientX - touchStartX;
      const verticalDistance = touchEnd.clientY - touchStartY;

      if (Math.abs(horizontalDistance) < 40 || Math.abs(horizontalDistance) <= Math.abs(verticalDistance)) {
        return;
      }

      rotateVideos(horizontalDistance < 0 ? 'left' : 'right');
    }, { passive: true });

    window.addEventListener('scroll', updateParallax, { passive: true });
    loadBestIllustrationVideo();
    updateGallery(0);
    updateParallax();

    const reelsLink = document.querySelector('.brand-dropdown a[href="#reel"]');
    reelsLink.addEventListener('click', (event) => {
      event.preventDefault();
      reelsLink.blur();
      window.history.pushState(null, '', '#reel');
      centerReelVideo();
    });

    window.addEventListener('load', () => {
      if (window.location.hash === '#reel') {
        centerReelVideo();
      }
    });

    const brandMenu = document.querySelector('.brand-menu');
    const brandLogo = brandMenu.querySelector('.logo');
    const brandDropdownLinks = brandMenu.querySelectorAll('.brand-dropdown a');

    brandDropdownLinks.forEach((link) => {
      link.addEventListener('click', () => {
        brandMenu.classList.remove('is-open');
        brandLogo.setAttribute('aria-expanded', 'false');
      });
    });

    brandLogo.addEventListener('click', (event) => {
      if (window.matchMedia('(max-width: 700px)').matches && !brandMenu.classList.contains('is-open')) {
        event.preventDefault();
        brandMenu.classList.add('is-open');
        brandLogo.setAttribute('aria-expanded', 'true');
      }
    });

    document.addEventListener('click', (event) => {
      if (!brandMenu.contains(event.target)) {
        brandMenu.classList.remove('is-open');
        brandLogo.setAttribute('aria-expanded', 'false');
      }
    });
  </script>

</body>
</html>
